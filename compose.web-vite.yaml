services:
  web-vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    depends_on:
      web:
        condition: service_started
    ports:
      - '127.0.0.1:18081:18081'
    volumes:
      - .:/workspace
      - type: volume
        source: node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
    working_dir: /workspace/apps/web-vite
    command: ['pnpm', 'dev', '--host', '0.0.0.0', '--port', '18081']
