  team-product:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    concurrency:
      group: real-provider-${{ github.repository }}-team-product
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
