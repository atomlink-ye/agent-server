name: Real Runtime

# Keep this workflow present on every supported event so the protected
# `real-runtime` check always reports. The three real-provider lanes are
# independent: one slow or failed lane cannot hide another lane's diagnostics.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to check out (defaults to the dispatch ref)'
        required: false
        type: string

# Superseded pull-request revisions should not continue charging a provider.
# Manual dispatches remain independent because they are keyed by run id.
concurrency:
  group: real-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-browser:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    # There are exactly three independent real-provider lanes; keeping a
    # distinct group per lane preserves parallel diagnostics while the
    # workflow-level group cancels superseded revisions.
    concurrency:
      group: real-provider-${{ github.repository }}-runtime-browser
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_server_runtime_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_server_runtime_browser"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_runtime_browser
      POSTGRES_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_runtime_browser
      POSTGRES_ADMIN_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_runtime_browser
      PORT: '3101'
      PASEO_PORT: '17671'
      HOME: ${{ github.workspace }}/.local/ci/runtime-browser/home
      PASEO_RUNTIME_ROOT: .local/ci/runtime-browser/runtime
      PASEO_AGENT_CWD: .local/ci/runtime-browser/agent-workspace
      PASEO_RUNTIME_CELL_ROOT: .local/ci/runtime-browser/runtime-cells
      AGENT_SERVER_SKILL_REGISTRY_ROOT: .local/ci/runtime-browser/skill-registry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Decide whether this lane may run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          skip() {
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runtime browser skipped::$1"
            {
              echo "## Runtime browser — skipped"
              echo
              echo "$1"
              echo
              echo "**This lane did not execute and cannot satisfy the real-runtime gate.**"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            skip "The pull request is a draft. Mark it ready for review to run the real-provider checks."
            exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            skip "The pull request comes from a fork, so repository provider credentials are unavailable."
            exit 0
          fi

          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(src/|scripts/dev/|scripts/smoke/|tooling/dev/|config/real-provider-defaults\.env|\.github/workflows/real-runtime\.yml|\.nvmrc|Dockerfile|package\.json|pnpm-lock\.yaml)'; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            skip "No runtime-relevant paths changed, so a real provider cannot observe this diff."
          fi

      - name: Enable Corepack
        if: steps.scope.outputs.eligible == 'true'
        run: corepack enable
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.eligible == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve provider credentials
        id: credentials
        if: steps.scope.outputs.eligible == 'true'
        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runtime browser skipped::OPENCODE_GO_API_KEY is not available."
            {
              echo "## Runtime browser — skipped"
              echo
              echo "OPENCODE_GO_API_KEY was not available, so no real-provider check executed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the Golden Path browser
        if: steps.credentials.outputs.available == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Make the checkout writable by the runner and runtime containers
        if: steps.credentials.outputs.available == 'true'
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: Real-provider runtime main flow
        if: steps.credentials.outputs.available == 'true'
        run: pnpm canary:runtime

      - name: Real-provider Golden Path
        if: steps.credentials.outputs.available == 'true'
        run: pnpm canary:golden-path

      - name: Enforce runtime-browser execution
        if: always()
        env:
          ELIGIBLE: ${{ steps.scope.outputs.eligible }}
          CREDENTIALS: ${{ steps.credentials.outputs.available }}
        run: |
          if [ "$ELIGIBLE" != "true" ] || [ "$CREDENTIALS" != "true" ]; then
            echo "runtime-browser did not execute the required real-provider flows" >&2
            exit 1
          fi

      - name: Redact runtime-browser diagnostics
        id: diagnostics
        if: always()
        env:
          DIAGNOSTIC_SECRET: ${{ secrets.OPENCODE_GO_API_KEY }}
          DIAGNOSTIC_ROOTS: .local/ci/runtime-browser/runtime/paseo-daemon.log:.local/ci/runtime-browser/runtime/logs:.local/ci/runtime-browser/test-runs
        run: node tooling/dev/redact-diagnostics.mjs >> "$GITHUB_OUTPUT"

      - name: Summarize runtime-browser diagnostics
        if: always()
        run: |
          {
            echo "## Runtime browser diagnostics"
            echo
            echo "- Files scanned: ${{ steps.diagnostics.outputs.files_scanned }}"
            echo "- Diagnostic bytes scanned: ${{ steps.diagnostics.outputs.bytes_scanned }}"
            echo "- Provider secret matches before redaction: ${{ steps.diagnostics.outputs.secret_matches_before }}"
            echo "- Provider secret matches after redaction: ${{ steps.diagnostics.outputs.secret_matches_after }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime-browser diagnostics
        if: always() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ci/runtime-browser/runtime/paseo-daemon.log
            .local/ci/runtime-browser/runtime/logs/**
            .local/ci/runtime-browser/test-runs/**
          if-no-files-found: warn
          retention-days: 7

  agent-team:
    runs-on: ubuntu-latest
    environment: test
    # The narrowed two-participant/one-Work smoke has a 5m provider gate. The
    # previous three-agent/two-Work/rework flow needed 900s; 20m leaves room
