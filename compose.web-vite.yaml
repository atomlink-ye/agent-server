services:
  web-vite-dependencies-init:
    image: agent-server-runner:latest
    user: '0:0'
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: web-vite-root-node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-vite-node-modules
        target: /workspace/apps/web-vite/node_modules
        volume:
          nocopy: true
    entrypoint: []
    command:
      [
        '/bin/sh',
        '-c',
        'chown 1000:1000 /workspace/node_modules && chown 1000:1000 /workspace/apps/web-vite/node_modules',
      ]
    restart: 'no'

  web-vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    depends_on:
      web:
        condition: service_started
      web-vite-dependencies-init:
        condition: service_completed_successfully
    environment:
      DOCKER_ENSURE_WEB_VITE_NODE_MODULES: 'true'
      DOCKER_ENSURE_WEB_NODE_MODULES: 'false'
    ports:
      - '127.0.0.1:18081:18081'
    volumes:
      - .:/workspace
      - type: volume
        source: web-vite-root-node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-vite-node-modules
        target: /workspace/apps/web-vite/node_modules
        volume:
          nocopy: true
    working_dir: /workspace
    entrypoint: ['node', 'scripts/dev/docker-ensure-node-modules.mjs']
    command: ['pnpm', '--dir', 'apps/web-vite', 'dev', '--host', '0.0.0.0', '--port', '18081']

volumes:
  web-vite-root-node-modules:
  web-vite-node-modules:
