name: PR Format Once

on:
  push:
    branches:
      - feat/cumora-work-organization-mve

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply prettier formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cumora-work-organization-mve
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier formatting"
          git push origin HEAD:feat/cumora-work-organization-mve
