name: Execution Capability Use Codemod

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tooling/execution-capability-use-codemod.mjs
      - name: Commit capability use
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/runtime/execution-session-resolver.ts
          git commit -m "refactor(runtime): negotiate execution capabilities explicitly"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
