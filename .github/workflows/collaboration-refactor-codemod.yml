name: Collaboration Refactor Codemod

on:
  push:
    branches:
      - refactor/collaboration-convergence-activation-v2
    paths:
      - tooling/codemods/restore-execute-run-test.mjs
      - .github/workflows/collaboration-refactor-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/collaboration-convergence-activation-v2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch known-good characterization baseline
        run: git fetch origin c17be81831239e09872d28f1bccdbc97007e9408 --depth=1
      - run: node tooling/codemods/restore-execute-run-test.mjs
      - name: Commit bounded test restoration
        run: |
          if git diff --quiet; then
            echo 'restore produced no diff' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/application/runs/execute-run.test.ts
          git commit -m 'test(collaboration): restore execute-run characterization suite'
          git push origin HEAD:refactor/collaboration-convergence-activation-v2
