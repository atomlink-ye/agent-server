services:
  paseo-runtime-state-init:
    image: agent-server-runner:latest
    user: '0:0'
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - paseo-runtime-state:/runtime-state
    entrypoint: []
    command:
      [
        '/bin/sh',
        '-c',
        'chown 0:0 /runtime-state && chmod 0700 /runtime-state && chown 1000:1000 /runtime-state',
      ]
    restart: 'no'

  paseo-runtime:
    image: agent-server-runner:latest
    init: true
    user: node
    depends_on:
      provider-toolchain-init:
        condition: service_completed_successfully
      paseo-runtime-state-init:
        condition: service_completed_successfully
    environment:
      HOME: /runtime-state/home
      PASEO_HOME: /runtime-state/paseo-home
      XDG_CONFIG_HOME: /runtime-state/xdg-config
      XDG_DATA_HOME: /runtime-state/xdg-data
      XDG_CACHE_HOME: /runtime-state/xdg-cache
      PASEO_RUNTIME_ROOT: /runtime-state
      PASEO_PORT: '16767'
      PASEO_LISTEN_HOST: 0.0.0.0
      PASEO_PROVIDER: ${PASEO_PROVIDER:?docker-compose wrapper must load real-provider defaults}
      PASEO_MODEL: ${PASEO_MODEL:?docker-compose wrapper must load real-provider defaults}
      PASEO_CONNECT_TIMEOUT_MS: ${PASEO_CONNECT_TIMEOUT_MS:-}
      PASEO_EXECUTION_TIMEOUT_MS: ${PASEO_EXECUTION_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_SESSION_RPC_TIMEOUT_MS: ${PASEO_SESSION_RPC_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_DAEMON_STARTUP_TIMEOUT_MS: ${PASEO_DAEMON_STARTUP_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_OPENCODE_SERVER_STARTUP_TIMEOUT_MS: ${PASEO_OPENCODE_SERVER_STARTUP_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_PROVIDER_REFRESH_TIMEOUT_MS: ${PASEO_PROVIDER_REFRESH_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_OPENCODE_APP_AGENTS_TIMEOUT_MS: ${PASEO_OPENCODE_APP_AGENTS_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_OPENCODE_PROVIDER_LIST_TIMEOUT_MS: ${PASEO_OPENCODE_PROVIDER_LIST_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      PASEO_OPENCODE_SESSION_CREATE_TIMEOUT_MS: ${PASEO_OPENCODE_SESSION_CREATE_TIMEOUT_MS:?docker-compose wrapper must load real-provider defaults}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
    volumes:
      - .:/workspace:ro
      - provider-toolchain:/opt/provider-toolchain-volume:ro
      - paseo-runtime-state:/runtime-state
    working_dir: /workspace
    entrypoint: []
    command: ['node', 'scripts/dev/paseo-runtime.mjs']

  agent-server:
    depends_on:
      provider-toolchain-init: !reset null
      paseo-runtime:
        condition: service_started
    environment: !override
      NODE_ENV: development
      CI: 'true'
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: agent-server
      RUNTIME_ADAPTER: ${RUNTIME_ADAPTER:-paseo}
      AGENT_SERVER_DISPATCHER_CONCURRENCY: ${AGENT_SERVER_DISPATCHER_CONCURRENCY:-4}
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_server
      POSTGRES_URL: postgresql://agent:agent@postgres:5432/agent_server
      SERVICE_ACCOUNTS_JSON: '[{"serviceAccountId":"svc_local","token":"token-local-dev","tenantId":"tenant_local","workspaceId":"${WEB_WORKSPACE_ID:-00000000-0000-4000-8000-000000000001}","policyVersion":"policy-local"},{"serviceAccountId":"svc_local_2","token":"token-local-dev-2","tenantId":"tenant_local_2","workspaceId":"${WEB_WORKSPACE_ID_2:-00000000-0000-4000-8000-000000000002}","policyVersion":"policy-local-2"}]'
      PASEO_WS_URL: ws://paseo-runtime:16767/ws
    volumes: !override
      - .:/workspace
      - type: volume
        source: node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-node-modules
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - local-state:/workspace/.local
    command:
      ['node', '--import', 'tsx', '--watch', 'src/entrypoints/api/server.ts']

volumes:
  paseo-runtime-state:
