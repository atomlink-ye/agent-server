        if: steps.credentials.outputs.available == 'true'
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: 'Product chain: registry + work identity + projection reachability'
        if: steps.credentials.outputs.available == 'true'
        env:
          SMOKE_OUTPUT_FILE: .local/ci/team-product/test-runs/team-registry-work.ndjson
        run: pnpm smoke:team-registry-work

      - name: Real-provider user-defined Team Work execution lifecycle
        if: steps.credentials.outputs.available == 'true'
        env:
          SMOKE_OUTPUT_FILE: .local/ci/team-product/test-runs/user-defined-team-work.ndjson
        run: node --import tsx tooling/dev/run-canary.ts user-defined-team-work

      - name: Enforce team-product execution
        if: always()
        env:
          ELIGIBLE: ${{ steps.scope.outputs.eligible }}
          CREDENTIALS: ${{ steps.credentials.outputs.available }}
