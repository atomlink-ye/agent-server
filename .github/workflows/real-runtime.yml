name: Real Runtime

# Everything that needs a real provider and its credentials, kept out of CI so
# that Deterministic and Real Postgres stay runnable from a clean checkout and
# stay free to run on every push.
#
# This is a required check, so the job must always run and always report. Both
# ways of saying "this change does not need a real provider" are therefore
# decided inside the job, never by a workflow-level `paths:` filter and never by
# a job-level `if:`. A required check that is filtered out at the workflow level
# is never reported at all, and the pull request waits for it forever.
#
# What actually decides:
#   - a draft pull request is skipped, since that is where churn lives; a branch
#     is a draft precisely while its intermediate revisions are still obsolete
#     before a provider could finish checking them
#   - a change touching none of the runtime-relevant paths is skipped
# Either way the job reports success in seconds and says in the summary why it
# did not run.
#
# A missing credential is also reported as a skip rather than a failure: a fork,
# or a clone without the `test` environment, genuinely cannot run these checks.
# Every skip is written to the job summary so that "did not run" never reads as
# "passed".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to check out (defaults to the dispatch ref)'
        required: false
        type: string

# One run per pull request, not one per push: a superseded revision is not worth
# paying a provider for. Manual dispatches are keyed by run id so they never
# cancel each other.
concurrency:
  group: real-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-runtime:
    runs-on: ubuntu-latest
    environment: test
    # Five real-provider flows run here, and the agent-team one may use up to
    # its 900s budget on a slow day. A job kill would surface as an opaque
    # cancellation rather than as a flow's own assertion, which is the failure
    # mode this workflow exists to avoid.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_server_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_server_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_dev
      POSTGRES_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_dev
      POSTGRES_ADMIN_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Decide whether these changes can reach the real runtime
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          skip() {
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real Runtime skipped::$1"
            {
              echo "## Real runtime — skipped"
              echo
              echo "$1"
              echo
              echo "**This is a skip, not a pass.** No real-provider check executed."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            skip "The pull request is a draft. Mark it ready for review to run the real-provider checks."
            exit 0
          fi

          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          # Why this exists: a skipped required check can look green while
          # silently missing a host-native runtime change.
          # Design contract: tooling/dev changes reach this real-runtime job.
          # Design goals: avoid false-green CI without charging unrelated docs.
          if printf '%s\n' "$changed" | grep -qE '^(src/|scripts/dev/|scripts/smoke/|tooling/dev/|config/real-provider-defaults\.env|\.github/workflows/real-runtime\.yml|\.nvmrc|Dockerfile|package\.json|pnpm-lock\.yaml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            skip "No runtime-relevant paths changed, so a real provider cannot observe this diff."
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - if: steps.scope.outputs.run == 'true'
        run: corepack enable

      - name: Resolve provider credentials
        id: credentials
        if: steps.scope.outputs.run == 'true'
        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real Runtime skipped::OPENCODE_GO_API_KEY is not available, so the real-provider checks did not run."
            {
              echo "## Real runtime — skipped"
              echo
              echo "\`OPENCODE_GO_API_KEY\` was not available to this run, so no real-provider"
              echo "check executed. **This is a skip, not a pass.**"
              echo
              echo "Expected on forks and on clones without the \`test\` environment."
              echo "On this repository it means the environment secret is missing or was revoked."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the Golden Path browser
        if: steps.credentials.outputs.available == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Make the checkout writable by the runner and runtime containers
        if: steps.credentials.outputs.available == 'true'
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: Real-provider runtime main flow
        if: steps.credentials.outputs.available == 'true'
        run: pnpm canary:runtime

      - name: Real-provider Golden Path
        if: steps.credentials.outputs.available == 'true'
        run: pnpm canary:golden-path

      # The 300s default was calibrated before the Team collaboration flow grew
      # its message/checkpoint round-trips, each of which is a real provider
      # call. At 300s the smoke aborts before the run reaches any terminal
      # state, so every failure reports "did not complete" regardless of cause
      # — a lead that legitimately needs more turns and a lead that never
      # converges are indistinguishable. A larger budget lets a genuine
      # non-convergence surface as a maxLeadTurns violation instead.
      - name: Real-provider agent-team main flow
        if: steps.credentials.outputs.available == 'true'
        env:
          AGENT_TEAM_SMOKE_TIMEOUT_MS: '900000'
        run: pnpm smoke:agent-team

      - name: 'Product chain: registry + work identity + projection reachability (no execution assertion)'
        if: steps.credentials.outputs.available == 'true'
        env:
          SMOKE_OUTPUT_FILE: .local/test-runs/team-registry-work.ndjson
        run: pnpm smoke:team-registry-work

      - name: Real-provider user-defined Team Work execution lifecycle
        if: steps.credentials.outputs.available == 'true'
        run: node --import tsx tooling/dev/run-canary.ts user-defined-team-work

      - name: Record that the real-provider checks ran
        if: steps.credentials.outputs.available == 'true'
        run: |
          {
            echo "## Real runtime — executed"
            echo
            echo "All external main flows ran against the real provider and asserted"
            echo "positive provider-side usage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Redact real-runtime diagnostics
        id: diagnostics
        if: always()
        env:
          DIAGNOSTIC_SECRET: ${{ secrets.OPENCODE_GO_API_KEY }}
          DIAGNOSTIC_ROOTS: .local/dev-runtime/logs:.local/test-runs
        run: |
          node tooling/dev/redact-diagnostics.mjs >> "$GITHUB_OUTPUT"

      - name: Summarize real-runtime diagnostics
        if: always()
        run: |
          {
            echo "## Real runtime diagnostics"
            echo
            echo "- Files scanned: ${{ steps.diagnostics.outputs.files_scanned }}"
            echo "- \`canary-*\` diagnostic files: ${{ steps.diagnostics.outputs.canary_log_files }}"
            echo "- Diagnostic bytes scanned: ${{ steps.diagnostics.outputs.bytes_scanned }}"
            echo "- OPENCODE_GO_API_KEY matches before redaction: ${{ steps.diagnostics.outputs.secret_matches_before }}"
            echo "- OPENCODE_GO_API_KEY matches after redaction: ${{ steps.diagnostics.outputs.secret_matches_after }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real-runtime diagnostics
        if: always() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: real-runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/dev-runtime/logs/**
            .local/test-runs/**
          if-no-files-found: warn
          retention-days: 7
