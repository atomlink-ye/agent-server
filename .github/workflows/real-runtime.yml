          path: |
            .local/ci/team-product/runtime/paseo-daemon.log
            .local/ci/team-product/runtime/logs/**
            .local/ci/team-product/test-runs/**
          if-no-files-found: warn
          retention-days: 7

  real-runtime:
    if: always()
    needs: [runtime-browser, agent-team, team-product]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate required real-provider lanes
        env:
          RUNTIME_BROWSER: ${{ needs['runtime-browser'].result }}
          AGENT_TEAM: ${{ needs['agent-team'].result }}
          TEAM_PRODUCT: ${{ needs['team-product'].result }}
        run: |
          {
            echo "## Real runtime gate"
            echo
            echo "- runtime-browser: ${RUNTIME_BROWSER}"
            echo "- agent-team: ${AGENT_TEAM}"
            echo "- team-product: ${TEAM_PRODUCT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNTIME_BROWSER" != "success" ] || [ "$AGENT_TEAM" != "success" ] || [ "$TEAM_PRODUCT" != "success" ]; then
            echo "real-runtime requires all three real-provider lanes to pass; skipped, cancelled, or failed lanes do not pass the gate." >&2
            exit 1
          fi
