name: Collaboration Refactor Codemod

on:
  push:
    branches:
      - refactor/collaboration-convergence-activation-v2
    paths:
      - tooling/codemods/collaboration-convergence-2.mjs
      - .github/workflows/collaboration-refactor-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/collaboration-convergence-activation-v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tooling/codemods/collaboration-convergence-2.mjs
      - name: Commit bounded refactor
        run: |
          if git diff --quiet; then
            echo 'codemod produced no diff' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/application/ports/team-execution-repository.ts \
                  src/infrastructure/postgres/postgres-collaborative-team-repository.ts \
                  src/application/collaboration/collaboration-kernel.ts \
                  src/bootstrap.ts \
                  src/application/runs/execution-observation-payload.ts
          git commit -m 'refactor(collaboration): converge activation boundaries'
          git push origin HEAD:refactor/collaboration-convergence-activation-v2
