version: 1

profiles:
  core:
    provider_toolchain: disabled
    services:
      - postgres
      - agent-server
    runtime:
      enabled: false
      adapter: none
    compose:
      files:
        - compose.yaml
        - compose.core.yaml

  runtime:
    provider_toolchain: required
    services:
      - provider-toolchain-init
      - paseo-runtime-state-init
      - paseo-runtime
      - agent-server
    runtime:
      enabled: true
      adapter: paseo
      provider: opencode
      model: opencode-go/deepseek-v4-flash
    compose:
      files:
        - compose.yaml
        - compose.runtime.yaml
        - compose.external-runtime.yaml

  full:
    extends: runtime
    services:
      - provider-toolchain-init
      - paseo-runtime-state-init
      - paseo-runtime
      - agent-server
      - web
