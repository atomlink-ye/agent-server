services:
  web-vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    depends_on:
      web:
        condition: service_started
    environment:
      DOCKER_ENSURE_WEB_VITE_NODE_MODULES: 'true'
    ports:
      - '127.0.0.1:18081:18081'
    volumes:
      - .:/workspace
      - type: volume
        source: node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-vite-node-modules
        target: /workspace/apps/web-vite/node_modules
    working_dir: /workspace
    entrypoint: ['node', 'scripts/dev/docker-ensure-node-modules.mjs']
    command: ['pnpm', '--dir', 'apps/web-vite', 'dev', '--host', '0.0.0.0', '--port', '18081']

volumes:
  web-vite-node-modules:
