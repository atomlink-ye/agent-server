name: Paseo OpenCode external smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  zero-credential-smoke:
    strategy:
      fail-fast: false
      matrix:
        target: [paseo-smoke, collaborative-team-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make ${{ matrix.target }}
