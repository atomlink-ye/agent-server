name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Focused self-starting real-Postgres test
        run: pnpm vitest run tests/integration/real-pg-pool.integration.test.ts
      - run: pnpm test:real-pg

  # Everything that needs a real provider and its credentials lives in this job,
  # so the two jobs above stay runnable from a clean checkout by anyone.
  #
  # Without the credential this job skips rather than fails: a fork, or a clone
  # without the `test` environment, genuinely cannot run these checks, and a red
  # there would say nothing about the change under review. The skip is always
  # written to the job summary so that "did not run" never reads as "passed".
  real-runtime:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    env:
      # Intentional mutation for ci/verify-real-runtime-skip-path only: prove
      # the credential-absent branch writes a visible skip rather than a pass.
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY_DELIBERATELY_ABSENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      - name: Resolve provider credentials
        id: credentials
        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real Runtime skipped::OPENCODE_GO_API_KEY is not available, so the real-provider checks did not run."
            {
              echo "## Real runtime — skipped"
              echo
              echo "\`OPENCODE_GO_API_KEY\` was not available to this run, so no real-provider"
              echo "check executed. **This is a skip, not a pass.**"
              echo
              echo "Expected on forks and on clones without the \`test\` environment."
              echo "On this repository it means the environment secret is missing or was revoked."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Make the checkout writable by the runner and runtime containers
        if: steps.credentials.outputs.available == 'true'
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: Real-provider runtime main flow
        if: steps.credentials.outputs.available == 'true'
        run: pnpm smoke:runtime

      - name: Real-provider agent-team main flow
        if: steps.credentials.outputs.available == 'true'
        run: pnpm smoke:agent-team

      - name: Record that the real-provider checks ran
        if: steps.credentials.outputs.available == 'true'
        run: |
          {
            echo "## Real runtime — executed"
            echo
            echo "Both external main flows ran against the real provider and asserted"
            echo "positive provider-side usage."
          } >> "$GITHUB_STEP_SUMMARY"
