name: Execution Plane Refactor Codemod

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply caller codemod
        run: node tooling/refactor-execution-plane-codemod.mjs
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/runs/execute-run.ts
          git commit -m "refactor(runtime): switch execute-run to execution plane service"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
