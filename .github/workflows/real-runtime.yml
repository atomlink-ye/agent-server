      POSTGRES_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_team_product
      POSTGRES_ADMIN_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_team_product
      PORT: '3103'
      PASEO_PORT: '17673'
      HOME: ${{ github.workspace }}/.local/ci/team-product/home
      PASEO_RUNTIME_ROOT: .local/ci/team-product/runtime
      PASEO_AGENT_CWD: .local/ci/team-product/agent-workspace
      PASEO_RUNTIME_CELL_ROOT: .local/ci/team-product/runtime-cells
