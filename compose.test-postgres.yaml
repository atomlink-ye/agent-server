services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_server
    ports:
      - '127.0.0.1:${AGENT_SERVER_TEST_POSTGRES_PORT}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_server']
      interval: 2s
      timeout: 3s
      retries: 30
