apiVersion: agent-server/v1alpha1
kind: ManagedTeam
metadata:
  name: collaborative-research-team
spec:
  environmentVersionId: environment://paseo-opencode
  lead:
    name: lead
    agentVersionId: agent://lead
  roster:
    - name: analyst
      agentVersionId: agent://analyst
    - name: verifier
      agentVersionId: agent://verifier
  coordination:
    mode: collaborative
    taskAssignment: lead_or_self_claim
