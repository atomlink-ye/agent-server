name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n1-contract-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/final-agent-identity-harness-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-agent-identity-harness-convergence
          fetch-depth: 0
      - name: Align same-tenant managed Agent invoke contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/contract/tasks.contract.test.ts')
          text = path.read_text()
          old = """  it('returns 404 when a different owner in the same tenant invokes a published version it does not own', async () => {
    const app = await createTestApp(new FakeAgentRuntime(), {
      startDispatcher: false,
    });
    const response = await app.request('/api/v1/tasks:invoke', {
      method: 'POST',
      headers: {
        authorization: `Bearer ${secondaryServiceAccountToken}`,
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        invokable: {
          kind: 'agent',
          version_id: defaultPublishedAgentVersionId,
        },
        input: { text: 'missing shared acl' },
      }),
    });

    expect(response.status).toBe(404);
    expect(ErrorResponseSchema.parse(await response.json()).error.code).toBe(
      'invokable_not_found',
    );
  });"""
          new = """  it('allows a different principal in the same tenant to invoke a published managed Agent version', async () => {
    const app = await createTestApp(new FakeAgentRuntime(), {
      startDispatcher: false,
    });
    const response = await app.request('/api/v1/tasks:invoke', {
      method: 'POST',
      headers: {
        authorization: `Bearer ${secondaryServiceAccountToken}`,
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        invokable: {
          kind: 'agent',
          version_id: defaultPublishedAgentVersionId,
        },
        input: { text: 'same tenant shared Agent' },
      }),
    });

    expect(response.status).toBe(202);
    const body = InvokeTaskResponseSchema.parse(await response.json());
    expect(body.status).toBe('queued');
    const task = await app.request(body.links.self, {
      headers: { authorization: `Bearer ${secondaryServiceAccountToken}` },
    });
    expect(task.status).toBe(200);
    expect(GetTaskResponseSchema.parse(await task.json()).invokable).toEqual({
      kind: 'agent',
      version_id: defaultPublishedAgentVersionId,
    });
  });"""
          if old not in text:
              raise SystemExit('stale task ownership contract block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit contract migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/tasks.contract.test.ts
          git commit -m "test: align task invoke with tenant-wide managed Agent use"
          git push origin HEAD:refactor/final-agent-identity-harness-convergence

  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scenario

  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_server_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg
