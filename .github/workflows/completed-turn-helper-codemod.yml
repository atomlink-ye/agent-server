name: Completed Turn Helper Codemod

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tooling/completed-turn-helper-codemod.mjs
      - name: Commit helper migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/runtime/execution-plane-runtime-facade.ts src/application/channels/synthesize-memory-document.ts src/application/channels/accept-memory-from-bound-document.ts tests/fixtures/fake-agent-runtime.ts
          git commit -m "refactor(runtime): narrow non-Run callers to completed turns"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
