        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Agent team skipped::OPENCODE_GO_API_KEY is not available."
            {
              echo "## Agent team — skipped"
              echo
              echo "OPENCODE_GO_API_KEY was not available, so no real-provider check executed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Make the checkout writable by the runner and runtime containers
        if: steps.credentials.outputs.available == 'true'
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: Real-provider agent-team main flow
        if: steps.credentials.outputs.available == 'true'
        env:
          AGENT_TEAM_SMOKE_TIMEOUT_MS: '300000'
        run: pnpm smoke:agent-team

      - name: Enforce agent-team execution
        if: always()
        env:
          ELIGIBLE: ${{ steps.scope.outputs.eligible }}
          CREDENTIALS: ${{ steps.credentials.outputs.available }}
        run: |
          if [ "$ELIGIBLE" != "true" ] || [ "$CREDENTIALS" != "true" ]; then
            echo "agent-team did not execute the required real-provider flow" >&2
            exit 1
          fi

      - name: Redact agent-team diagnostics
        id: diagnostics
        if: always()
        env:
          DIAGNOSTIC_SECRET: ${{ secrets.OPENCODE_GO_API_KEY }}
          DIAGNOSTIC_ROOTS: .local/ci/agent-team/runtime/paseo-daemon.log:.local/ci/agent-team/runtime/logs:.local/ci/agent-team/test-runs
        run: node tooling/dev/redact-diagnostics.mjs >> "$GITHUB_OUTPUT"

      - name: Summarize agent-team diagnostics
        if: always()
        run: |
          {
            echo "## Agent team diagnostics"
