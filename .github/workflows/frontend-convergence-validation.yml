name: Frontend convergence validation

on:
  push:
    branches:
      - refactor/single-vite-frontend

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Canonical browser components
        run: pnpm test:web:canonical
      - name: Single frontend architecture
        run: pnpm web:check:architecture
      - name: Production Vite build
        run: pnpm web:build
