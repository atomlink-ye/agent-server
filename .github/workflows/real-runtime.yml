        id: credentials
        if: steps.scope.outputs.eligible == 'true'
        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Team product skipped::OPENCODE_GO_API_KEY is not available."
            {
              echo "## Team product — skipped"
              echo
              echo "OPENCODE_GO_API_KEY was not available, so no real-provider check executed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

