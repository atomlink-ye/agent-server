    timeout-minutes: 20
    concurrency:
      group: real-provider-${{ github.repository }}-agent-team
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_server_agent_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_server_agent_team"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
