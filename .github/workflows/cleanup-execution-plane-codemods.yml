name: Cleanup Execution Plane Codemods

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - name: Remove temporary codemods
        run: |
          git rm -f \
            .github/workflows/runtime-binding-lookup-codemod.yml \
            .github/workflows/durable-compat-session-codemod.yml \
            .github/workflows/channel-execution-service-codemod.yml \
            .github/workflows/cleanup-execution-plane-codemods.yml \
            tooling/runtime-binding-lookup-codemod.mjs \
            tooling/durable-compat-session-codemod.mjs \
            tooling/channel-execution-service-codemod.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(runtime): remove temporary refactor codemods"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
