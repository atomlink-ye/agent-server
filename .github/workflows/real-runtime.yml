      POSTGRES_ADMIN_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_agent_team
      PORT: '3102'
      PASEO_PORT: '17672'
      HOME: ${{ github.workspace }}/.local/ci/agent-team/home
      PASEO_RUNTIME_ROOT: .local/ci/agent-team/runtime
      PASEO_AGENT_CWD: .local/ci/agent-team/agent-workspace
