name: Format authoring PR

on:
  push:
    branches:
      - feature/coworker-capability-authoring-golden-path

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format changed authoring files
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/agents/agents-gateway.ts \
            apps/web/src/features/agents/agents.css \
            apps/web/src/features/agents/AgentsPage.tsx \
            apps/web/src/features/agents/authoring.ts \
            apps/web/src/features/agents/AuthoringPanels.tsx \
            apps/web/src/features/work/components/new-work.tsx \
            apps/web/src/features/work/work-page.css \
            apps/web/src/features/work/WorkPage.tsx \
            src/application/work/capability-authoring.test.ts \
            src/contracts/agents.ts \
            src/entrypoints/api/routes/agent-profile.ts \
            src/entrypoints/api/routes/agent-work-catalog.ts \
            src/entrypoints/api/routes/browser-coworkers.test.ts \
            src/entrypoints/api/routes/browser-coworkers.ts \
            src/entrypoints/api/routes/coworker-authoring.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style: format authoring Golden Path'
          git push origin HEAD:feature/coworker-capability-authoring-golden-path
