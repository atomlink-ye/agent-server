version: 1

profiles:
  in-process:
    provider_toolchain: disabled
    services: []
    runtime:
      enabled: false
      adapter: none
    compose:
      transport: raw
      files: []

  postgres:
    provider_toolchain: disabled
    services:
      - postgres-test
    runtime:
      enabled: false
      adapter: none
    compose:
      transport: raw
      files:
        - compose.test-postgres.yaml

  core:
    provider_toolchain: disabled
    services:
      - postgres
      - agent-server
    runtime:
      enabled: false
      adapter: none
    compose:
      transport: repository
      files:
        - compose.yaml
        - compose.core.yaml

  runtime:
    provider_toolchain: required
    services:
      - provider-toolchain-init
      - paseo-runtime-state-init
      - paseo-runtime
      - agent-server
    runtime:
      enabled: true
      adapter: paseo
      provider: claude
      model: opencode-go/deepseek-v4-flash
    compose:
      transport: repository
      files:
        - compose.yaml
        - compose.runtime.yaml
        - compose.external-runtime.yaml

  full:
    extends: runtime
    services:
      - provider-toolchain-init
      - paseo-runtime-state-init
      - paseo-runtime
      - agent-server
      - web

  acceptance:
    extends: full
    services:
      - provider-toolchain-init
      - paseo-runtime-state-init
      - paseo-runtime
      - agent-server
      - web
      - web-vite
    compose:
      transport: repository
      files:
        - compose.yaml
        - compose.runtime.yaml
        - compose.external-runtime.yaml
        - compose.web-vite.yaml
