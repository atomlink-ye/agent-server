name: Runtime external smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Require real-provider credentials
        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "::error::OPENCODE_GO_API_KEY is not set — the real-provider gate cannot run"
            exit 1
          fi
      - name: Make the checkout writable by the runner and runtime containers
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
      - name: Run real-provider runtime smoke
        run: pnpm smoke:runtime
      - name: Run real-provider agent-team smoke
        run: pnpm smoke:agent-team
