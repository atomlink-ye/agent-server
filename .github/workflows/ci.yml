name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n1-migrate-fixtures:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/final-agent-identity-harness-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-agent-identity-harness-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/dev/n1-migrate-tests.mjs
      - name: Commit migrated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/create-test-app.ts tests/integration/agent-registry-postgres.integration.impl.ts tests/integration/durable-kernel-postgres.integration.test.ts tests/integration/real-pg-pool.integration.impl.ts tests/integration/session-lane-postgres.integration.impl.ts
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "test: migrate legacy Agent fixtures to canonical managed path"
          git push origin HEAD:refactor/final-agent-identity-harness-convergence

  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scenario

  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_server_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg
