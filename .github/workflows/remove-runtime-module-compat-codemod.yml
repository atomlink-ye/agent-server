name: Remove Runtime Module Compatibility Codemod

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tooling/remove-runtime-module-compat-codemod.mjs
      - name: Commit compatibility removal
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/runtime/runtime-module.ts src/bootstrap.ts
          git rm -f src/adapters/runtime/legacy-agent-runtime-execution-service.ts
          git commit -m "refactor(runtime): remove legacy runtime module compatibility"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
