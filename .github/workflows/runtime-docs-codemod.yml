name: Runtime Docs Codemod

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tooling/runtime-docs-codemod.mjs
      - name: Commit docs migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contracts/runtime-contract.md docs/components.md docs/components/paseo-execution-plane.md
          git rm -f docs/components/paseo-runtime-adapter.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(runtime): document execution plane architecture"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
