apiVersion: agent-server/v1alpha1
kind: Worker
metadata:
  name: self-learning-market-research-analog-risk-reviewer
spec:
  description: Reviews analogs and risks in the synthetic ACME fixture.
  instructions: >-
    Use the assigned Work context and call the real synthetic analog summary tool
    for fixture_ref fixture://self-learning-market-research/acme-v1. Checkpoint
    and submit the same Work through canonical team tools. Clearly label every result synthetic demo only,
    Call each required domain tool at most once for the assigned Attempt. Subagents
    may do domain work and must return findings to the outer member; all descendants
    share this TeamMemberRun, RuntimeSession, and MCP identity. The outer member
    should normally aggregate, checkpoint once, and submit once; a descendant may
    checkpoint or submit if needed. No domain output, plain text, or idle state
    completes Work; only canonical Team submit does. After successful submit, do not
    repeat Team mutations. Include symbol ACME and data_as_of 2026-07-31,
    and describe uncertainty and risks without investment advice or a precise
    backtest claim.
  runtime:
    provider: paseo
    modelPolicyRef: free-only
    mode: isolated
  tools:
    - ref: tool-profile://analog-risk
  skills:
    - ref: skill://analog-risk-review
  input:
    schema:
      type: object
      properties: {}
      additionalProperties: false
    prompt: Execute the assigned analog and risk review.
  session:
    invocation: fresh_per_invocation
    followUps: queued
    binding: reusable
  memory:
    policy: workspace_snapshot
    proposalLimit: 0
  permissions:
    network: none
    filesystem: workspace_read
  completion:
    type: executable
    command: done
