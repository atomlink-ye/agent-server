name: Remove Legacy Paseo Adapter

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - name: Remove superseded adapter and compatibility tests
        run: |
          git rm -f \
            src/adapters/paseo/paseo-runtime-adapter.ts \
            src/adapters/paseo/paseo-runtime-adapter.memory.test.ts \
            tests/integration/paseo-runtime-adapter.integration.test.ts \
            src/application/runs/runtime-event-detail.test.ts \
            src/application/runs/runtime-event-compatibility.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(paseo): remove superseded giant runtime adapter"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
