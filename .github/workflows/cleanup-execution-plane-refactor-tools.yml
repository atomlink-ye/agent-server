name: Cleanup Execution Plane Refactor Tools

on:
  push:
    branches:
      - refactor/execution-plane-paseo-architecture

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/execution-plane-paseo-architecture
      - name: Remove temporary refactor workflows and codemods
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/cleanup-execution-plane-refactor-tools.yml \
            .github/workflows/execution-turn-result-codemod.yml \
            .github/workflows/paseo-launch-policy-codemod.yml \
            .github/workflows/remove-provider-binding-compat-codemod.yml \
            .github/workflows/execution-capability-use-codemod.yml \
            .github/workflows/legacy-debug-result-codemod.yml \
            .github/workflows/remove-runtime-module-compat-codemod.yml \
            .github/workflows/remove-agent-runtime-facade-codemod.yml \
            .github/workflows/execute-run-result-mapping-codemod.yml \
            .github/workflows/paseo-client-contract-codemod.yml \
            .github/workflows/runtime-docs-codemod.yml \
            .github/workflows/remove-old-paseo-adapter.yml \
            tooling/execution-turn-result-codemod.mjs \
            tooling/paseo-launch-policy-codemod.mjs \
            tooling/remove-provider-binding-compat-codemod.mjs \
            tooling/execution-capability-use-codemod.mjs \
            tooling/legacy-debug-result-codemod.mjs \
            tooling/remove-runtime-module-compat-codemod.mjs \
            tooling/remove-agent-runtime-facade-codemod.mjs \
            tooling/execute-run-result-mapping-codemod.mjs \
            tooling/paseo-client-contract-codemod.mjs \
            tooling/runtime-docs-codemod.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(runtime): remove temporary refactor tooling"
          git push origin HEAD:refactor/execution-plane-paseo-architecture
