services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_server
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_server']
      interval: 2s
      timeout: 3s
      retries: 30

  agent-server:
    image: agent-server-runner:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit because `web-testing` is now the last stage in the Dockerfile
      # and an unpinned build would pick it up, reintroducing the chromium layer
      # this split exists to avoid.
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:16767:16767'
    environment:
      NODE_ENV: development
      CI: 'true'
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: agent-server
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      PASEO_CONNECT_TIMEOUT_MS: ${PASEO_CONNECT_TIMEOUT_MS:-}
      PASEO_EXECUTION_TIMEOUT_MS: ${PASEO_EXECUTION_TIMEOUT_MS:-}
      # A coarse upper bound while the daemon TCP connection remains alive
      # and a request is stuck; it is not latency tuning or a death detector.
      # A disconnected daemon immediately rejects pending waiters; this does
      # not distinguish a busy request from a deadlock.
      # Keep it at least twice the 300s real-provider execution timeout.
      PASEO_SESSION_RPC_TIMEOUT_MS: ${PASEO_SESSION_RPC_TIMEOUT_MS:-900000}
      AGENT_SERVER_DISPATCHER_CONCURRENCY: ${AGENT_SERVER_DISPATCHER_CONCURRENCY:-4}
      PASEO_PORT: '16767'
      PASEO_LISTEN_HOST: '0.0.0.0'
      # Both must include the browser-visible origin when the daemon is reached
      # through a proxy: the UI loads over HTTP but then opens a WebSocket, and
      # the daemon rejects it with "Origin not allowed" / "Host not allowed".
      PASEO_CORS_ORIGINS: ${PASEO_CORS_ORIGINS:-http://localhost:18081,http://127.0.0.1:18081}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES:-}
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_server
      POSTGRES_URL: postgresql://agent:agent@postgres:5432/agent_server
      HOME: /workspace/.local/home
      PASEO_HOME: /workspace/.local/paseo-home
      XDG_CONFIG_HOME: /workspace/.local/xdg-config
      XDG_DATA_HOME: /workspace/.local/xdg-data
      XDG_CACHE_HOME: /workspace/.local/xdg-cache
      PASEO_RELAY_ENABLED: 'false'
      PASEO_DICTATION_ENABLED: 'false'
      PASEO_VOICE_MODE_ENABLED: 'false'
      # The Paseo daemon runs inside this container, so exporting this on the
      # host does nothing unless compose forwards it. Off unless set to '1'.
      PASEO_DEV_WEB_UI: ${PASEO_DEV_WEB_UI:-}
      SERVICE_ACCOUNTS_JSON: '[{"serviceAccountId":"svc_local","token":"token-local-dev","tenantId":"tenant_local","workspaceId":"${WEB_WORKSPACE_ID:-00000000-0000-4000-8000-000000000001}","policyVersion":"policy-local"},{"serviceAccountId":"svc_local_2","token":"token-local-dev-2","tenantId":"tenant_local_2","workspaceId":"${WEB_WORKSPACE_ID_2:-00000000-0000-4000-8000-000000000002}","policyVersion":"policy-local-2"}]'
    volumes:
      - .:/workspace
      - type: volume
        source: node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-node-modules
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - local-state:/workspace/.local
    working_dir: /workspace
    entrypoint: ['node', 'scripts/dev/docker-ensure-node-modules.mjs']
    # Keep this equivalent to package.json dev:api without invoking pnpm's
    # command shim. On a restored named volume pnpm can decide to relink the
    # entire dependency tree before running a script (8 minutes on
    # fuse-overlayfs), even though the repository bootstrap already verified
    # the stamp and critical executables.
    command:
      [
        'node',
        'scripts/dev/with-paseo.mjs',
        '--',
        'node',
        '--import',
        'tsx',
        '--watch',
        'src/entrypoints/api/server.ts',
      ]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 45m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit because `web-testing` is now the last stage in the Dockerfile
      # and an unpinned build would pick it up, reintroducing the chromium layer
      # this split exists to avoid.
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    depends_on:
      agent-server:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - path: .local/web-bootstrap.env
        required: false
    environment:
      NODE_ENV: development
      CI: 'true'
      AGENT_SERVER_BASE_URL: http://agent-server:3000
      AGENT_SERVER_SERVICE_TOKEN: ${AGENT_SERVER_SERVICE_TOKEN:-token-local-dev}
    volumes:
      - .:/workspace
      - type: volume
        source: node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-node-modules
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - local-state:/workspace/.local
    working_dir: /workspace
    entrypoint: ['node', 'scripts/dev/docker-ensure-node-modules.mjs']
    command: ['pnpm', 'web:dev']

  runner:
    shm_size: 1gb
    # Explicit image name so the tag no longer depends on the compose project
    # name. The project name is what isolates concurrent lanes sharing one
    # sandbox (it scopes containers and volumes), but it also used to decide the
    # image tag — which meant either the lanes collided or the prebuilt image in
    # the sandbox template was missed. Naming the image here separates the two.
    image: agent-server-runner:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit because `web-testing` is now the last stage in the Dockerfile
      # and an unpinned build would pick it up, reintroducing the chromium layer
      # this split exists to avoid.
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    entrypoint: ['node', 'scripts/dev/docker-ensure-node-modules.mjs']
    environment:
      NODE_ENV: test
      CI: 'true'
      HOME: /workspace/.local/home
      PASEO_HOME: /workspace/.local/paseo-home
      XDG_CONFIG_HOME: /workspace/.local/xdg-config
      XDG_DATA_HOME: /workspace/.local/xdg-data
      XDG_CACHE_HOME: /workspace/.local/xdg-cache
      PASEO_RELAY_ENABLED: 'false'
      PASEO_DICTATION_ENABLED: 'false'
      PASEO_VOICE_MODE_ENABLED: 'false'
    volumes:
      - .:/workspace
      # Named, not anonymous. `docker compose run --rm` destroys anonymous
      # volumes on exit, so every single make target used to start with an
      # empty node_modules and re-seed ~200k files before running anything.
      # Staleness is already handled by the dependency stamp in
      # scripts/dev/docker-ensure-node-modules.mjs, so persisting these is safe.
      - type: volume
        source: node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-node-modules
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - runner-dist:/workspace/dist
      - /workspace/.local
    working_dir: /workspace

  postgres-test:
    image: postgres:16
    profiles: [postgres-test]
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_server
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_server']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  node-modules:
    name: ${NODE_MODULES_VOLUME:?docker-compose wrapper must provide NODE_MODULES_VOLUME}
    external: true
  web-node-modules:
    name: ${WEB_NODE_MODULES_VOLUME:?docker-compose wrapper must provide WEB_NODE_MODULES_VOLUME}
    external: true
  runner-dist:
  local-state:
  postgres-data:
