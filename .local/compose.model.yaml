services:
  agent-server:
    volumes:
      - type: bind
        source: ./.local/seed-team.mjs
        target: /workspace/.local/seed-team.mjs
        read_only: true
    env_file:
      - path: .local/model.env
        required: true
    environment:
      PASEO_EXECUTION_TIMEOUT_MS: '300000'
      AGENT_SERVER_DISPATCHER_CONCURRENCY: '1'
