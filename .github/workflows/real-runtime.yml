name: Real Runtime

# Everything that needs a real provider and its credentials, kept out of CI so
# that Deterministic and Real Postgres stay runnable from a clean checkout and
# stay free to run on every push.
#
# This deliberately does not run per commit. Three things keep it to roughly one
# run per pull request: draft pull requests are skipped entirely, a new push
# cancels the run its predecessor started, and a path filter keeps unrelated
# changes out. Merge queue would express this more directly, but it is not
# available on this repository.
#
# `workflow_dispatch` remains available for running it by hand or through the
# API against any ref.
#
# When the credential is absent this reports a skip rather than a failure: a
# fork, or a clone without the `test` environment, genuinely cannot run these
# checks. The skip is written to the job summary so that "did not run" never
# reads as "passed".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/real-runtime.yml'
      - '.nvmrc'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.runtime.yaml'
      - 'compose.external-runtime.yaml'
      - 'config/local-environments.yaml'
      - 'config/real-provider-defaults.env'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/dev/**'
      - 'scripts/smoke/**'
      - 'src/**'
      - 'tooling/environment/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to check out (defaults to the dispatch ref)'
        required: false
        type: string

# One run per pull request, not one per push. A superseded revision is not worth
# paying a provider for, so an in-flight run is cancelled as soon as a newer
# commit arrives. Manual dispatches are keyed by run id so they never cancel
# each other.
concurrency:
  group: real-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-runtime:
    # Draft pull requests do not run. That is where the churn lives: a branch is
    # a draft precisely while it is still being reworked, and its intermediate
    # revisions are obsolete before a real provider could finish checking them.
    # Marking the pull request ready for review triggers this.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      - name: Resolve provider credentials
        id: credentials
        run: |
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real Runtime skipped::OPENCODE_GO_API_KEY is not available, so the real-provider checks did not run."
            {
              echo "## Real runtime — skipped"
              echo
              echo "\`OPENCODE_GO_API_KEY\` was not available to this run, so no real-provider"
              echo "check executed. **This is a skip, not a pass.**"
              echo
              echo "Expected on forks and on clones without the \`test\` environment."
              echo "On this repository it means the environment secret is missing or was revoked."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Make the checkout writable by the runner and runtime containers
        if: steps.credentials.outputs.available == 'true'
        run: |
          runner_group="$(id -g)"
          sudo chown -R 1000:"$runner_group" "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: Real-provider runtime main flow
        if: steps.credentials.outputs.available == 'true'
        run: pnpm smoke:runtime

      - name: Real-provider agent-team main flow
        if: steps.credentials.outputs.available == 'true'
        run: pnpm smoke:agent-team

      - name: Record that the real-provider checks ran
        if: steps.credentials.outputs.available == 'true'
        run: |
          {
            echo "## Real runtime — executed"
            echo
            echo "Both external main flows ran against the real provider and asserted"
            echo "positive provider-side usage."
          } >> "$GITHUB_STEP_SUMMARY"
