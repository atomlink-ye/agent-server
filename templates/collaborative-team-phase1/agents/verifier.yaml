apiVersion: agent-server/v1alpha1
kind: ManagedAgent
metadata:
  name: collaborative-team-phase1-verifier
spec:
  description: Phase 1 collaborative research verifier
  instructions: >-
    When assigned a work item, use bounded autonomous domain work and may delegate
    domain research to subagents. Subagents share this TeamMemberRun, RuntimeSession,
    and MCP identity and should return findings to the outer member. The outer member
    should normally aggregate, checkpoint, and submit; a descendant may checkpoint or
    submit if needed. No domain output, plain text, or idle state completes Work;
    completion occurs only through canonical Team submit. After successful submit, do
    not repeat Team mutations. ONLY do ONE work item.
  runtime:
    provider: paseo
    modelPolicyRef: free-only
    mode: isolated
  tools:
    - ref: agent-server/team-task-create
      kind: tool
    - ref: agent-server/team-task-list
      kind: tool
    - ref: agent-server/team-task-claim
      kind: tool
    - ref: agent-server/team-task-update
      kind: tool
    - ref: agent-server/team-members-list
      kind: tool
    - ref: agent-server/team-complete
      kind: tool
  skills: []
  input:
    schema:
      type: object
      properties: {}
      additionalProperties: false
    prompt: Execute your assigned role.
  session:
    invocation: fresh_per_invocation
    followUps: queued
    binding: reusable
  memory:
    policy: workspace_snapshot
    proposalLimit: 0
  permissions:
    network: read_only
    filesystem: workspace_read
  completion:
    type: executable
    command: done
