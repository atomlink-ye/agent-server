name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n1-scenario-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/final-agent-identity-harness-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-agent-identity-harness-convergence
          fetch-depth: 0
      - name: Patch structured scenario invocation context
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/scenarios/north-star-host-harness.scenario.test.ts')
          text = path.read_text()
          anchor = "  return { h, world, product } as const;\n}\n\nasync function startWorkThroughScriptedRuntime("
          helper = """  return { h, world, product } as const;
}

function scenarioInvocationContext(
  world: Awaited<ReturnType<AgentServerHarness['seed']['goldenPath']>>,
  scopeId: string,
) {
  const productScope = {
    tenantId: world.owner.tenantId,
    workspaceId: world.owner.workspaceId,
  };
  const actor = {
    type: world.owner.principalType,
    id: world.owner.principalId,
  };
  return {
    scope: {
      kind: 'agent_chat' as const,
      agentChatRuntimeId: scopeId,
      runtimeEpoch: 1,
    },
    productScope,
    actor,
    agentOwner: { scope: productScope, principal: actor },
    agentDefinitionId: world.agent.definitionId,
    agentVersionId: world.agent.versionId,
    conversationId: world.conversation.id,
    triggerMessageId: world.triggerMessageId,
  } as const;
}

async function startWorkThroughScriptedRuntime("""
          if anchor not in text:
              raise SystemExit('scenario helper anchor missing')
          text = text.replace(anchor, helper, 1)
          old = """  const created = await h.runtime.createSession({
    runtimeSessionId: scopeId,
    systemPrompt: `Agent definition ID: ${world.agent.definitionId}`,
    mcpServer: mcp,
    token: receipt.token,
  });"""
          new = """  const created = await h.runtime.createSession({
    runtimeSessionId: scopeId,
    systemPrompt: 'Structured Agent identity is supplied by RuntimeInvocationContext.',
    invocationContext: scenarioInvocationContext(world, scopeId),
    mcpServer: mcp,
    token: receipt.token,
  });"""
          if old not in text:
              raise SystemExit('direct scenario createSession block missing')
          text = text.replace(old, new, 1)
          old = """        const created = await h.runtime.plane.createSession({
          runtimeSessionId: `chat-runtime-${world.conversation.id}`,
          workspace: { cwd: process.cwd() },
          systemPrompt: input.systemPrompt ?? '',
          extensions: input.extensions,
        });"""
          new = """        const created = await h.runtime.plane.createSession({
          runtimeSessionId: `chat-runtime-${world.conversation.id}`,
          workspace: { cwd: process.cwd() },
          systemPrompt: input.systemPrompt ?? '',
          invocationContext: input.invocationContext,
          extensions: input.extensions,
        });"""
          if old not in text:
              raise SystemExit('reconciler runtime createSession block missing')
          text = text.replace(old, new, 1)
          old = """      {
        async resolve() {
          return {
            instructions: 'Harness deterministic chat brain',
            capabilitySummary: {},
            agentHome: {},
          } as any;
        },
      } as any,"""
          new = """      {
        async resolve(input: any) {
          const invocationContext = scenarioInvocationContext(world, input.runtime.id);
          return {
            instructions: 'Harness deterministic chat brain',
            capabilitySummary: {},
            agentHome: {},
            invocationContext,
            agentOwner: invocationContext.agentOwner,
            resolvedSkills: [],
            toolRefs: [],
          } as any;
        },
      } as any,"""
          if old not in text:
              raise SystemExit('reconciler brain block missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit scenario migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/scenarios/north-star-host-harness.scenario.test.ts
          git commit -m "test: carry structured Agent identity through North Star harness"
          git push origin HEAD:refactor/final-agent-identity-harness-convergence

  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scenario

  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_server_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent_server_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg
